[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Pin the classic default ruleset so `ruff check .` is deterministic in CI
# regardless of the installed ruff version's default selection.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"gui/advanced_layout_manager.py" = ["E741"]

[project]
name = "monitor-layout-manager"
version = "1.5.0"
description = "The easiest way to manage multiple monitors on macOS."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Artur Grochau", email = "arturgrochau@gmail.com" }]
